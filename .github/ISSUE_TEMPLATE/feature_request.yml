name: Feature request
description: Propose a new attachment rule, option or capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The behavior you want
      description: What should extraction produce? What is the use case?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: An authoring rule, a CLI option, an API change, or a change to the `AssociationNode` schema.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
